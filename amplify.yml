version: 2
backend:
  phases:
    build:
      commands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - npx ampx generate outputs --branch "$BACKEND_APP_BRANCH" --app-id "$BACKEND_APP_ID"
frontend:
  phases:
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - ~/.pnpm-store/**/*
